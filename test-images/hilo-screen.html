<!DOCTYPE html>
<html>
<head>
    <title>Marcador HiLo - Versão para Ecrã</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: white;
        }
        .marker-container {
            width: 80vh;
            height: 80vh;
            max-width: 90vw;
            max-height: 90vw;
        }
        .marker-svg {
            width: 100%;
            height: 100%;
        }
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="marker-container">
        <svg class="marker-svg" viewBox="0 0 16 16">
            <!-- Fundo branco -->
            <rect x="0" y="0" width="16" height="16" fill="white"/>
            
            <!-- Borda externa com margem branca -->
            <rect x="3" y="3" width="10" height="10" fill="black"/>
            <rect x="4" y="4" width="8" height="8" fill="white"/>
            
            <!-- Padrão interno -->
            <rect x="4" y="4" width="8" height="8" fill="black"/>
            <rect x="5" y="5" width="6" height="6" fill="white"/>
            <rect x="6" y="6" width="4" height="4" fill="black"/>
        </svg>
    </div>
    
    <div class="instructions">
        Abra a aplicação AR no seu telemóvel e aponte para este marcador.<br>
        Ajuste o brilho do ecrã para o máximo para melhor detecção.
    </div>
</body>
</html>
