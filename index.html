<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiLo Card AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- Definimos o marcador que será reconhecido -->
        <a-marker type="pattern" url="patterns/hilo-pattern.patt">
            <!-- Cubo 3D vermelho girando -->
            <a-box position="0 0.5 0" 
                   rotation="0 45 45" 
                   material="color: red;"
                   animation="property: rotation; to: 360 360 360; dur: 2000; easing: linear; loop: true">
            </a-box>
            
            <!-- Texto 3D -->
            <a-text value="HiLo Card Detectado!" 
                    position="0 1.5 0" 
                    align="center" 
                    color="blue"
                    scale="1 1 1">
            </a-text>
        </a-marker>
        
        <!-- Câmera -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <div class="ui-container">
        <div class="instructions">
            <p>Aponte a câmera para um cartão HiLo para ver o modelo 3D</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
