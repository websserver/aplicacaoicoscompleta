<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiLo Card AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- Definimos o marcador que será reconhecido -->
        <a-marker type="pattern" url="patterns/hilo-pattern.patt">
            <!-- O modelo 3D que será exibido quando o marcador for detectado -->
            <a-entity position="0 0 0" 
                      rotation="0 0 0" 
                      scale="0.05 0.05 0.05" 
                      gltf-model="models/hilo3dmodel.glb"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"></a-entity>
        </a-marker>
        
        <!-- Câmera -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <div class="ui-container">
        <div class="instructions">
            <p>Aponte a câmera para um cartão HiLo para ver o modelo 3D</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
