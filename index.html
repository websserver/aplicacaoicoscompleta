<!DOCTYPE html>
<html>
<head>
    <title>AR.js HiLo Card Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        .arjs-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
        }
        #debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            font-family: monospace;
            z-index: 1000;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader">
        <div>A carregar a experiência AR...</div>
    </div>

    <div id="debug">Status: À procura do marcador...</div>

    <a-scene embedded
             vr-mode-ui="enabled: false"
             renderer="logarithmicDepthBuffer: true;"
             arjs="trackingMethod: best;
                   sourceType: webcam; 
                   debugUIEnabled: false;
                   detectionMode: mono;
                   patternRatio: 0.90;
                   cameraParametersUrl: https://raw.githack.com/AR-js-org/AR.js/master/data/data/camera_para.dat">
        
        <a-marker type="pattern" 
                  url="patterns/hilo-pattern.patt"
                  smooth="true"
                  smoothCount="10"
                  smoothTolerance="0.01"
                  smoothThreshold="2"
                  raycaster="objects: .clickable"
                  emitevents="true">
            
            <a-box position="0 0.5 0" 
                   material="color: red;" 
                   scale="1 1 1"
                   class="clickable"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 2000;">
            </a-box>
            
            <a-text value="HiLo Card Detectado!" 
                    position="0 1.5 0" 
                    align="center" 
                    color="white"
                    scale="1 1 1">
            </a-text>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        window.addEventListener('load', function () {
            const scene = document.querySelector('a-scene');
            const loader = document.querySelector('.arjs-loader');
            const marker = document.querySelector('a-marker');
            const debug = document.querySelector('#debug');
            
            scene.addEventListener('loaded', function () {
                loader.style.display = 'none';
                console.log('AR.js iniciado');
            });

            marker.addEventListener('markerFound', function() {
                debug.textContent = 'Status: Marcador detectado!';
                debug.style.backgroundColor = 'rgba(0, 255, 0, 0.8)';
                console.log('Marcador encontrado!');
            });

            marker.addEventListener('markerLost', function() {
                debug.textContent = 'Status: Marcador perdido. Tente novamente.';
                debug.style.backgroundColor = 'rgba(255, 0, 0, 0.8)';
                console.log('Marcador perdido!');
            });
        });
    </script>
</body>
</html>
